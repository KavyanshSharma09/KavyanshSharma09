<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260">
  <style>
    .bg { fill: #0D1117; }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes enter   { from { transform: translateX(-460px); } to { transform: translateX(0); } }
    @keyframes introOut{ 0%, 72% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes nameIn  { 0%, 76% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes streak  { 0% { opacity: 0; } 30% { opacity: .7; } 100% { opacity: 0; } }

    .intro  { animation: introOut 5s ease forwards; }
    .mover  { animation: enter 1s cubic-bezier(.2,.8,.2,1) forwards; }
    .blade  { transform-box: fill-box; transform-origin: center; animation: spin .3s linear infinite; }
    .aura   { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite reverse; }
    .lines  { animation: streak .6s ease-out 0s 4; }

    .name   { opacity: 0; animation: nameIn 5s ease forwards; }
    .title  { font: 700 46px 'JetBrains Mono', 'Courier New', monospace; fill: #E6EDF3; }
    .sub    { font: 500 17px 'JetBrains Mono', 'Courier New', monospace; fill: #2EA043; }
  </style>

  <rect class="bg" width="800" height="260" rx="12"/>

  <!-- intro: spinning blade -->
  <g class="intro">
    <g class="mover">
      <!-- speed streaks -->
      <g class="lines" stroke="#F97316" stroke-width="3" stroke-linecap="round">
        <line x1="150" y1="110" x2="300" y2="110"/>
        <line x1="120" y1="130" x2="300" y2="130"/>
        <line x1="150" y1="150" x2="300" y2="150"/>
      </g>

      <!-- ground shadow -->
      <ellipse cx="400" cy="205" rx="62" ry="9" fill="#000" opacity=".55"/>

      <!-- aura ring -->
      <g class="aura">
        <circle cx="400" cy="130" r="84" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="14 18" opacity=".8"/>
      </g>

      <!-- blade -->
      <g class="blade">
        <g transform="translate(400,130)">
          <g fill="#F97316">
            <path d="M0,-72 L20,-46 L-20,-46 Z"/>
            <path d="M0,-72 L20,-46 L-20,-46 Z" transform="rotate(60)"/>
            <path d="M0,-72 L20,-46 L-20,-46 Z" transform="rotate(120)"/>
            <path d="M0,-72 L20,-46 L-20,-46 Z" transform="rotate(180)"/>
            <path d="M0,-72 L20,-46 L-20,-46 Z" transform="rotate(240)"/>
            <path d="M0,-72 L20,-46 L-20,-46 Z" transform="rotate(300)"/>
          </g>
          <circle r="50" fill="#1F2937" stroke="#EF4444" stroke-width="6"/>
          <circle r="30" fill="#111827" stroke="#F59E0B" stroke-width="3"/>
          <circle r="11" fill="#F59E0B"/>
        </g>
      </g>
    </g>
  </g>

  <!-- reveal: name -->
  <g class="name">
    <text class="title" x="400" y="125" text-anchor="middle">Kavyansh Sharma</text>
    <text class="sub"   x="400" y="162" text-anchor="middle">$ backend  |  llm tooling  |  open to work</text>
  </g>
</svg>
