<svg width="100%" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="waveGradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#00E5FF"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 700 42px 'Courier New', monospace; fill: #E6FCFF; opacity: 0; animation: fadeInHeader 1.4s ease-in forwards; }
    .subtitle { font: 500 18px 'Courier New', monospace; fill: #00E5FF; opacity: 0; animation: fadeInHeader 1.4s ease-in 0.7s forwards; }
    @keyframes fadeInHeader { to { opacity: 1; } }
  </style>
  <rect width="1200" height="180" fill="#0D1117"/>
  <path d="M0,150 C300,105 900,190 1200,130 L1200,180 L0,180 Z" fill="url(#waveGradHeader)" opacity="0.55"/>
  <text x="600" y="82" text-anchor="middle" class="title">Kavyansh Sharma</text>
  <text x="600" y="118" text-anchor="middle" class="subtitle">Backend &amp; Systems Engineer</text>
</svg>
